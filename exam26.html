<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let number =100;
        
        switch(parseInt(number/10)){
            case 10:
            case 9:
                alert("A입니다.");
                break;
            case 8:
                alert("B입니다.");
                break;
            case 7:
                alert("C입니다.");
                break;
            case 6:
                alert("D입니다.");
                break;
            default:
                alert("F입니다.");
                break;
                
        }
    </script>
</head>
<body>
    <h1>JS조건문</h1>
</body>
</html>
