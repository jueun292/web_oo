<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>selector실습</title>
    <style> *{ color: blue;} /*전체선택자*/
    p{ background-color:yellow;} /*태그선택자*/
    .c1 { border:1px solid red;}/*class 선택자*/
    #n1 {background-color: aqua;}/*id 선택자*/
    ul li{color: brown;} /*하위선택자*/
    ol>li{color: chartreuse;} /*자식선택자*/
    
    </style>
</head>
<style>
    /*링크 가상 클래스*/
    a:link{color: black; text-decoration:none;}
    a:visited{color:black;}
    a:hover{color: cyan;}
    a:active {background-color:darkgray;}
</style>
<body>
    <h1 style= "color: red;">CSS 스타일</h1>
    <h2 class = "c1">스타일 사용</h2>
    <p>CSS는 디자인과 정보의 분리를 위해 사용.</p>
    <p class ="c1">CSS는 디자인과 정보의 분리를 위해 사용.</p>
    <ul>
        <li id="n1">HTML</li><!--id선택자는 하나만 쓰는걸 권유 id는 identification 중복되지 않게써야됨-->
        <li>CSS</li>
        <li>JS</li>
    </ul>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <a href ="www.syu.ac.kr"></a>
</body>
</html>
