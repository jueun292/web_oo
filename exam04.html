<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>글머리 기호 목록</h1>
    <ul type="circle">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ul>
    <h1>순서 번호 목록</h1>
    <!-- start는 아라비아 숫자로 써줘야됨-->
    <ol type="i" start="4">
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>
    <h1>정의 목록</h1>
    <dl>
        <dt>프론트엔드</dt>
        <dd>HTML</dd>
        <dd>CSS</dd>
        <dd>JS</dd>
        <dt>백엔드</dt>
        <dd>MySQL</dd>
        <dd>NODE.JS</dd>
       
    </dl>
</body>
</html>
