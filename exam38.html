<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script src = "https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
    $(document).ready(function(){
        $('a').click(function(event){
            //이벤트관련된 정보를 처리하거나 이럴때 매개변수를 하나 넣어줘야됨
            event.preventDefault(); //기본 이벤트 처리가 제거됨
            alert('링크 이동 불가');
        });
        $('p').hover(function(){
            $(this).css('color','red');
        }, function(){
            $(this).css('color','black');
        });
    });
</script>
<body>
    <h1>jQuery 이벤트처리</h1>
    <p><a href ="https://www.syu.ac.kr">삼육대학교</a></p>
    <p id = "i1">인공지능융합학부</p>
    <p>hi</p>
    <button>클릭</button>
</body>
</html>
