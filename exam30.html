<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JS 중첩 반복문 - 구구단 (2~9단)</h1>
    <script>
       for (let dan = 2; dan <= 9; dan++) {
         for (let num = 1; num <= 9; num++) {
             document.write(dan + " x " + num + " = " + (dan * num) + "<br>");
    }

    document.write("<br>");
}
    </script>
</body>
</html>
